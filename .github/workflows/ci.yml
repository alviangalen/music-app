name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-build:
    name: Lint & Compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: Build and Typecheck
        run: |
          cd ${{ matrix.service }}
          npm run build

  docker-build:
    name: Validate Docker Builds & Compose
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: music-app-backend:test
          load: true

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: music-app-frontend:test
          load: true

      - name: Test Stack Spin-up and Healthcheck
        run: |
          docker compose up -d
          echo "Waiting for backend to report healthy..."
          timeout 60s bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} music-app-backend)" == "healthy" ]; do sleep 2; done'
          timeout 30s bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} music-app-frontend)" == "healthy" ]; do sleep 2; done'
          
          echo "Verifying reverse proxy routing via port 80..."
          curl -f http://localhost:80/healthz || exit 1
          curl -f "http://localhost:80/api/search?q=coldplay" || exit 1
          
          docker compose down